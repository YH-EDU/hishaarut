name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for /hishaarut/
        run: npm run build
        env:
          VITE_BASE_PATH: /hishaarut/
          VITE_SUPABASE_URL: https://rgybnihrbbkdpgjperms.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_IOAO8TrMetGb8DUKjjxb6Q_vAWL-dKP
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
